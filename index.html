<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1a1510" />
    <title>Bass Interval Board</title>
    <link rel="stylesheet" href="styles.css?v=5" />
  </head>
  <body>
    <header class="header">
      <div class="header-bar">
        <h1>Bass Interval Board</h1>
        <button
          type="button"
          id="btn-settings"
          class="btn-settings"
          aria-expanded="false"
          aria-controls="settings-panel"
        >
          Settings
        </button>
      </div>
    </header>

    <div
      id="settings-backdrop"
      class="settings-backdrop"
      hidden
      aria-hidden="true"
    ></div>
    <aside
      id="settings-panel"
      class="settings-panel"
      hidden
      aria-hidden="true"
      aria-labelledby="settings-title"
    >
      <div class="settings-panel-inner">
        <div class="settings-panel-head">
          <h2 id="settings-title">Settings</h2>
          <button
            type="button"
            id="btn-settings-close"
            class="btn-icon"
            aria-label="Close settings"
          >
            ✕
          </button>
        </div>

        <div class="scale-controls">
          <label class="control">
            <span class="control-label">Root</span>
            <select id="scale-root" class="select"></select>
          </label>
          <label class="control">
            <span class="control-label">Scale</span>
            <select id="scale-type" class="select"></select>
          </label>
          <label class="control control-check">
            <input type="checkbox" id="show-scale-notes" />
            <span>Show scale on neck</span>
          </label>
          <div class="control control-segment">
            <span class="control-label">Display as</span>
            <div class="segmented" role="group" aria-label="Label type">
              <label class="segmented-option">
                <input type="radio" name="label-mode" value="alphabet" checked />
                <span>Alphabet</span>
              </label>
              <label class="segmented-option">
                <input type="radio" name="label-mode" value="interval" />
                <span>Interval</span>
              </label>
            </div>
          </div>
          <label class="control control-check" id="accidental-wrap">
            <input type="checkbox" id="use-flats" />
            <span id="accidental-label">Use ♭ (flats)</span>
          </label>
        </div>

        <div class="toolbar settings-toolbar">
          <button type="button" id="btn-clear" class="btn">Clear board</button>
          <button type="button" id="btn-save" class="btn btn-primary">Save stickers</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <section class="fretboard-wrap" aria-label="Fretboard">
        <div id="fretboard" class="fretboard"></div>
        <div id="toast" class="toast" hidden></div>
      </section>

      <section class="palette-section" aria-label="Interval stickers">
        <p class="palette-hint">Drag to a fret · tap sticker to remove</p>
        <div id="palette" class="palette"></div>
      </section>
    </main>

    <script src="app.js?v=5"></script>
  </body>
</html>
